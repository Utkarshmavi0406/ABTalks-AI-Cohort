apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: dailytask-backend:latest
          imagePullPolicy: Never  # image is loaded locally via `minikube image load`, never pulled from a registry
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: llm-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20  # backend loads an embedding model on startup, needs a grace period
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
